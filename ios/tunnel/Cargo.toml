# The iroh tunnel of docs/PROTOCOL.md as a library: iOS cannot start the dumbpipe binary the Android app runs.
[package]
name = "lidrop-tunnel"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
dumbpipe = "=0.40.1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
noq = "1"
tokio = { version = "1.34", features = ["net", "rt-multi-thread", "sync", "time", "io-util", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
netdev = { path = "patches/netdev" }
netwatch = { path = "patches/netwatch" }
