name: Lidrop
options:
  bundleIdPrefix: dev.lidrop
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64   # vendor/LidropTunnel.xcframework has no Intel simulator slice
targets:
  Lidrop:
    type: application
    platform: iOS
    sources: [Lidrop]
    dependencies:
      - target: LidropShare
      - framework: vendor/LidropTunnel.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    entitlements:
      path: Lidrop/Lidrop.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.lidrop.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lidrop.ios
        PRODUCT_NAME: lidrop
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Lidrop/Info.plist
      properties:
        CFBundleDisplayName: lidrop
        UILaunchScreen:
          UIColorName: LaunchBackground   # the app's own dark, not a white flash on every open
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: lidrop finds your Mac on the local network to send and receive files.
        NSBonjourServices: ["_lidrop._tcp"]
        NSPhotoLibraryUsageDescription: lidrop shows your photos and videos so you can drag them to your Mac.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
  LidropShare:
    type: app-extension
    platform: iOS
    sources:
      - LidropShare
      - Lidrop/Common.swift
      - Lidrop/Connector.swift
      - Lidrop/Drag.swift
      - Lidrop/Light.swift
      - Lidrop/Media.swift
      - Lidrop/Model.swift
      - Lidrop/Net.swift
      - Lidrop/Overlay.swift
      - Lidrop/Receiver.swift
      - Lidrop/Shaders.swift
      - Lidrop/Tiles.swift
      - Lidrop/Tunnel.swift
    dependencies:
      - framework: vendor/LidropTunnel.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    entitlements:
      path: LidropShare/LidropShare.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.lidrop.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lidrop.ios.share
        PRODUCT_NAME: LidropShare
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: LidropShare/Info.plist
      properties:
        CFBundleDisplayName: lidrop
        NSLocalNetworkUsageDescription: lidrop finds your Mac on the local network to send and receive files.
        NSBonjourServices: ["_lidrop._tcp"]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsFileWithMaxCount: 100
  LidropUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LidropUITests]
    dependencies:
      - target: Lidrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lidrop.ios.uitests
        TEST_TARGET_NAME: Lidrop
